<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recipes</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recipes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f3ec">
<link rel="apple-touch-icon" href="recipes-icon.png">
<style>
:root{--bg:#f7f3ec;--card:#fff;--ink:#2b2622;--mute:#7a7067;--line:#e6ded2;--accent:#b5562f}
@media (prefers-color-scheme:dark){:root{--bg:#1c1a18;--card:#262320;--ink:#f1ebe3;--mute:#a59a8e;--line:#3a3530;--accent:#e08a5f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
h1{margin:0 0 8px;font-size:26px}
#q{width:100%;font-size:17px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 11px;border-radius:16px;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
#count{color:var(--mute);font-size:13px;padding:8px 16px 0}
ul{list-style:none;margin:0;padding:6px 12px calc(env(safe-area-inset-bottom) + 20px)}
li{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin:8px 0}
li img,li .ph{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none;background:var(--line)}
li .t{flex:1;min-width:0}
li .n{font-weight:600}
li .m{color:var(--mute);font-size:13px;margin-top:2px}
li a{color:inherit;text-decoration:none;display:flex;gap:12px;align-items:center;flex:1;min-width:0}
.err{padding:20px 16px;color:var(--accent)}
.hint{color:var(--mute);font-size:12px;text-align:center;padding:0 16px 20px}
#card{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:20;display:none;padding:calc(env(safe-area-inset-top) + 8px) 0 40px}
#card .bar{display:flex;gap:8px;padding:6px 14px 10px;position:sticky;top:0;background:var(--bg)}
#card .bar button,#card .bar a{font:600 15px system-ui;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none}
#card .bar .pr{margin-left:auto;background:var(--accent);border-color:var(--accent);color:#fff}
#card img{width:100%;max-height:260px;object-fit:cover;display:block}
#card .b{padding:14px 18px;font-family:Georgia,serif}
#card h2{font:700 12px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:18px 0 8px}
#card ul{padding-left:20px;margin:0} #card li{display:list-item;background:none;border:0;border-radius:0;padding:0;margin:0 0 6px} #card ol{padding-left:22px;margin:0} #card ol li{margin-bottom:10px}
#card .note{color:var(--mute);font-size:.95em}
#printmenu{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
#printmenu .sheet{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 16px)}
#printmenu .sheet div{font:600 13px system-ui;color:var(--mute);text-align:center;margin:2px 0 12px}
#printmenu button{display:block;width:100%;font:600 17px system-ui;padding:14px;margin:0 0 8px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#printmenu button.go{background:var(--accent);border-color:var(--accent);color:#fff}
#printmenu button:disabled{opacity:.45}
#scanprint{display:none}
#scanprint img{width:100%;display:block;page-break-after:always;break-after:page}
#busy{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;font:600 15px system-ui;padding:14px 18px;border-radius:12px;z-index:50;display:none}
@media print{
  body>*{display:none!important}
  body:not(.print-scan) #card{position:static;display:block!important;overflow:visible}
  body:not(.print-scan) #card .bar{display:none}
  body.print-scan #scanprint{display:block!important}
}
</style>
</head>
<body>
<header>
  <h1>Recipes</h1>
  <input id="q" type="search" placeholder="Search name, chef, source…" autocomplete="off">
  <div class="chips" id="owner"></div>
  <div class="chips" id="meal"></div>
  <div class="chips" id="protein"></div>
</header>
<div id="count">Loading…</div>
<ul id="list"></ul>
<div id="card"></div>
<div id="printmenu"><div class="sheet"><div>Print</div><button class="go" id="pm-card">Recipe card</button><button id="pm-scan">Original scan</button><button id="pm-cancel">Cancel</button></div></div>
<div id="scanprint"></div>
<div id="busy">Preparing scan…</div>
<p class="hint">Tap a recipe to open it. To print: Share → Print.</p>
<script>
const SUPABASE_URL='https://ndrwzvhebakozjlfnvax.supabase.co';
const SUPABASE_KEY='sb_publishable_jWnI0f_lvzFq9-vgk56B5Q_oU4rOZjU';
let all=[],f={owner:'',meal:'',protein:''};
const norm=s=>{s=(s||'').trim();if(!s||/^(none|na)$/i.test(s))return'';s=s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const map={eggs:'egg',vegtable:'vegetable'};s=map[s]||s;return s.replace(/\b\w/g,c=>c.toUpperCase());};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chips(id,key){const vals=[...new Set(all.map(r=>r[key]).filter(Boolean))].sort();
  const el=document.getElementById(id);
  el.innerHTML=['All',...vals].map(v=>`<button class="chip${(f[key]||'All')===v?' on':''}" data-v="${esc(v)}">${esc(v)}</button>`).join('');
  el.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;f[key]=b.dataset.v==='All'?'':b.dataset.v;chips(id,key);render();};}
function render(){const q=document.getElementById('q').value.trim().toLowerCase();
  const rows=all.filter(r=>(!f.owner||r.owner===f.owner)&&(!f.meal||r.meal===f.meal)&&(!f.protein||r.protein===f.protein)&&
    (!q||[r.name,r.author_chef,r.source,r.ethnicity,r.cooking_method,r.comments].join(' ').toLowerCase().includes(q)));
  document.getElementById('count').textContent=rows.length+' of '+all.length+' recipes';
  document.getElementById('list').innerHTML=rows.map(r=>{
    const who=[r.author_chef,r.source].find(v=>v&&!/^(unknown|na)$/i.test(v.trim()));
    const meta=[r.meal,r.protein,who].filter(Boolean).map(esc).join(' · ');
    const img=r.photo_url?`<img loading="lazy" src="${esc(r.photo_url)}" alt="">`:'<div class="ph"></div>';
    const hasCard=(r.ingredients||'').trim()||(r.instructions||'').trim();
    const inner=`${img}<div class="t"><div class="n">${esc(r.name)}</div><div class="m">${meta}${r.recipe_url?'':' · no scan'}</div></div>`;
    return `<li><a href="#" data-card="${r.recipe_id}">${inner}</a></li>`;}).join('');}
document.getElementById('list').addEventListener('click',e=>{const a=e.target.closest('a[data-card]');if(!a)return;e.preventDefault();showCard(+a.dataset.card);});
let pdfReady=null;
function loadPdfJs(){
  if(pdfReady) return pdfReady;
  pdfReady=(async()=>{
    await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=res;s.onerror=()=>rej(new Error('Could not load the PDF reader'));document.head.appendChild(s);});
    const w=await (await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js')).text();
    pdfjsLib.GlobalWorkerOptions.workerPort=new Worker(URL.createObjectURL(new Blob([w],{type:'application/javascript'})));
  })();
  pdfReady.catch(()=>{pdfReady=null;});
  return pdfReady;
}
function openPrintMenu(id){
  const r=all.find(x=>x.recipe_id===id); if(!r) return;
  const m=document.getElementById('printmenu');
  document.getElementById('pm-scan').disabled=!r.recipe_url;
  document.getElementById('pm-scan').textContent=r.recipe_url?'Original scan':'Original scan (none on file)';
  document.getElementById('pm-card').onclick=()=>{m.style.display='none';document.body.classList.remove('print-scan');setTimeout(()=>window.print(),50);};
  document.getElementById('pm-scan').onclick=()=>{m.style.display='none';printScan(r);};
  document.getElementById('pm-cancel').onclick=()=>{m.style.display='none';};
  m.style.display='flex';
}
async function printScan(r){
  const busy=document.getElementById('busy'), out=document.getElementById('scanprint');
  busy.style.display='block';
  try{
    await loadPdfJs();
    const buf=await (await fetch(r.recipe_url)).arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
    out.innerHTML='';
    for(let i=1;i<=pdf.numPages;i++){
      const pg=await pdf.getPage(i), vp=pg.getViewport({scale:2});
      const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
      await pg.render({canvasContext:c.getContext('2d'),viewport:vp,intent:'print'}).promise;
      const img=new Image();img.src=c.toDataURL('image/jpeg',0.9);out.appendChild(img);
      await new Promise(res=>{img.onload=res;img.onerror=res;});
    }
    busy.style.display='none';
    document.body.classList.add('print-scan');
    const done=()=>{document.body.classList.remove('print-scan');out.innerHTML='';window.removeEventListener('afterprint',done);};
    window.addEventListener('afterprint',done);
    setTimeout(()=>window.print(),100);
  }catch(e){
    busy.style.display='none';
    if(confirm("Couldn't prepare the scan here. Open it instead? You can print it from Safari's Share button.")) window.open(r.recipe_url,'_blank');
  }
}
function showCard(id){const r=all.find(x=>x.recipe_id===id);if(!r)return;
  const ing=(r.ingredients||'').split('\n').map(l=>l.trim()).filter(Boolean);
  let steps='',open=false;for(const par of (r.instructions||'').trim().split(/\n\s*\n/).filter(Boolean)){const m=par.trim().match(/^(\d+)[.)]\s*([\s\S]*)$/);
    if(m){if(!open){steps+='<ol>';open=true;}steps+=`<li>${esc(m[2])}</li>`;}else{if(open){steps+='</ol>';open=false;}steps+=`<p class="note">${esc(par.trim())}</p>`;}}
  if(open)steps+='</ol>';
  const c=document.getElementById('card');
  c.innerHTML=`<div class="bar"><button onclick="document.getElementById('card').style.display='none'">‹ Back</button>${r.recipe_url?`<a href="${esc(r.recipe_url)}" target="_blank" rel="noopener">Scan</a>`:''}<button class="pr" onclick="openPrintMenu(${r.recipe_id})">Print</button></div>
  ${r.photo_url?`<img src="${esc(r.photo_url)}" alt="">`:''}<div class="b"><h1 style="margin:0 0 4px">${esc(r.name)}</h1>
  <div class="note">${esc([r.author_chef,r.source].filter(v=>v&&!/^(unknown|na)$/i.test(v.trim())).join(' · '))}</div>
  <h2>Ingredients</h2>${ing.length?`<ul>${ing.map(i=>/:$/.test(i)?`<li style="list-style:none;margin:10px 0 4px -20px;font:700 12px system-ui;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)">${esc(i.replace(/:$/,''))}</li>`:`<li>${esc(i)}</li>`).join('')}</ul>`:'<p class="note">See the scan.</p>'}
  <h2>Instructions</h2>${steps||'<p class="note">See the scan.</p>'}</div>`;
  c.style.display='block';c.scrollTop=0;}
document.getElementById('q').addEventListener('input',render);
fetch(SUPABASE_URL+'/rest/v1/recipes?select=recipe_id,name,owner,ingredients,instructions,meal_type,protein,ethnicity,cooking_method,source,author_chef,comments,photo_url,recipe_url&order=name.asc',
  {headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}})
 .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
 .then(d=>{all=d.map(r=>({...r,name:(r.name||'').trim(),meal:norm(r.meal_type),protein:norm(r.protein)}));chips('owner','owner');chips('meal','meal');chips('protein','protein');render();})
 .catch(e=>{document.getElementById('count').innerHTML='<div class="err">Couldn’t load recipes ('+esc(e.message)+'). Check your connection.</div>';});
</script>
</body>
</html>
